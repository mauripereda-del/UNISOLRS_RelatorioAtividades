<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="UNISOL RS — Relatório de Atividades" />
    <title>Entrar — UNISOL RS Relatório de Atividades</title>
    <link rel="stylesheet" href="./css/reset.css" />
    <link rel="stylesheet" href="./css/variables.css" />
    <link rel="stylesheet" href="./css/global.css" />
    <link rel="stylesheet" href="./css/components.css" />
    <link rel="stylesheet" href="./css/login.css" />
  </head>
  <body class="app-auth">
    <a class="skip-link" href="#conteudo-login">Ir para o conteúdo</a>

    <main id="conteudo-login" class="cartao">
      <header class="cartao__cabecalho">
        <div class="marca login-marca">
          <img
            class="marca__logo"
            src="./assets/images/logounisol.png"
            alt="UNISOL RS"
            width="48"
            height="48"
          />
          <div>
            <span class="marca__nome">UNISOL RS</span>
            <span class="marca__subtitulo">Relatório de Atividades</span>
          </div>
        </div>
        <h1 class="cartao__titulo">Acesso</h1>
        <p class="cartao__descricao">
          Use as credenciais fornecidas pelo administrador para acessar o sistema.
        </p>
      </header>

      <div id="aviso-configuracao" class="alerta alerta--aviso" hidden></div>
      <div id="alerta" class="alerta" hidden role="status" aria-live="polite"></div>

      <form id="form-login" novalidate>
        <div class="campo">
          <label for="email">E-mail</label>
          <input
            id="email"
            name="email"
            type="email"
            autocomplete="username"
            required
            placeholder="seu.email@exemplo.com"
          />
        </div>

        <div class="campo">
          <label for="senha">Senha</label>
          <div class="campo__controle">
            <input
              id="senha"
              name="senha"
              type="password"
              autocomplete="current-password"
              required
            />
            <button
              id="alternar-senha"
              class="botao-senha"
              type="button"
              aria-pressed="false"
              aria-controls="senha"
            >
              Mostrar
            </button>
          </div>
        </div>

        <div class="acoes-formulario">
          <button id="botao-entrar" class="botao botao--primario" type="submit">Entrar</button>
          <div class="login-links">
            <a class="botao botao--texto" href="./pages/recuperar-senha.html">Esqueci minha senha</a>
          </div>
        </div>
      </form>

      <p class="rodape-auth">Acesso restrito a usuários autorizados.</p>
    </main>

    <script src="./js/env.js"></script>
    <script type="module" src="./js/login.js"></script>
  </body>
</html>
